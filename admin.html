<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYURYU SMP - Admin Dashboard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            heading: ['Fredoka', 'cursive'],
          },
          colors: {
            paper: {
              50: '#fdfcf7',
              100: '#fbf8f0',
              200: '#f5efe0',
              border: '#e2d5bd',
              dark: '#2c2825'
            }
          },
          boxShadow: {
            'paper': '4px 4px 0px 0px rgba(44, 40, 37, 0.15)',
            'paper-sm': '2px 2px 0px 0px rgba(44, 40, 37, 0.12)'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f7f4ec;
      background-image: radial-gradient(#e5dec9 0.75px, transparent 0.75px), radial-gradient(#e5dec9 0.75px, #f7f4ec 0.75px);
      background-size: 30px 30px;
      color: #2c2825;
    }
  </style>
</head>
<body class="antialiased font-sans min-h-screen flex flex-col justify-between">

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden max-w-sm bg-stone-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl border-2 border-stone-700 items-center gap-3">
    <i class="fa-solid fa-circle-check text-emerald-400 text-xl" id="toast-icon"></i>
    <span id="toast-message" class="text-sm font-medium">Aksi berhasil!</span>
  </div>

  <!-- SECTION 1: LOGIN FORM (JIKA BELUM LOGGED IN) -->
  <div id="section-login" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-paper-50 p-8 rounded-3xl border-3 border-paper-dark shadow-paper w-full max-w-md space-y-6">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 bg-amber-500 rounded-2xl border-2 border-paper-dark shadow-paper-sm mx-auto flex items-center justify-center text-white text-3xl">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h1 class="font-heading text-3xl font-bold text-stone-900">KYURYU SMP ADMIN</h1>
        <p class="text-xs text-stone-600 font-semibold">Silakan masuk menggunakan akun admin Supabase.</p>
      </div>

      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Email</label>
          <input type="email" id="login-email" required placeholder="nama@gmail" class="w-full px-4 py-2.5 rounded-xl border-2 border-paper-dark bg-white text-stone-800 text-sm focus:outline-none focus:border-amber-600 font-medium" />
        </div>

        <div>
          <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Password</label>
          <input type="password" id="login-password" required placeholder="your password" class="w-full px-4 py-2.5 rounded-xl border-2 border-paper-dark bg-white text-stone-800 text-sm focus:outline-none focus:border-amber-600 font-medium" />
        </div>

        <button type="submit" id="btn-login" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-extrabold rounded-xl border-2 border-paper-dark shadow-paper-sm active:translate-y-0.5 transition-all text-sm uppercase tracking-wide">
          <i class="fa-solid fa-right-to-bracket mr-1.5"></i> LOGIN DASHBOARD
        </button>
      </form>
    </div>
  </div>

  <!-- SECTION 2: DASHBOARD UTAMA (JIKA SUDAH LOGGED IN) -->
  <div id="section-dashboard" class="hidden min-h-screen pb-12">
    <!-- Navbar Admin -->
    <header class="bg-paper-100 border-b-2 border-paper-border py-4 sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-amber-500 rounded-xl border-2 border-paper-dark shadow-paper-sm flex items-center justify-center text-white">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <span class="font-heading font-extrabold text-xl text-stone-900">KYURYU SMP <span class="text-amber-600">ADMIN</span></span>
        </div>

        <div class="flex items-center gap-4">
          <span id="user-email-badge" class="text-xs font-bold font-mono bg-amber-100 text-amber-900 px-3 py-1 rounded-lg border border-amber-300 hidden sm:inline-block">
            admin@kyuryu.my.id
          </span>
          <button onclick="handleLogout()" class="px-3.5 py-1.5 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl border-2 border-paper-dark shadow-paper-sm transition-all uppercase">
            <i class="fa-solid fa-power-off mr-1"></i> Logout
          </button>
        </div>
      </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 pt-8 space-y-10">
      
      <!-- GRID FORM CREATE/EDIT -->
      <div class="grid lg:grid-cols-2 gap-8">
        
        <!-- FORM 1: INFORMASI TERBARU -->
        <div class="bg-paper-50 p-6 sm:p-8 rounded-3xl border-3 border-paper-dark shadow-paper space-y-6">
          <div class="flex justify-between items-center border-b-2 border-stone-200 pb-4">
            <h2 id="form-news-title" class="font-heading text-2xl font-extrabold text-stone-900">📰 INFORMASI TERBARU</h2>
            <button id="btn-cancel-news" onclick="resetNewsForm()" class="hidden px-2.5 py-1 bg-stone-200 hover:bg-stone-300 text-stone-800 text-xs font-bold rounded-lg border border-stone-400">
              Batal Edit
            </button>
          </div>

          <form id="form-news" onsubmit="submitNews(event)" class="space-y-4">
            <input type="hidden" id="news-id" />

            <div>
              <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Judul Informasi *</label>
              <input type="text" id="news-input-title" required placeholder="Contoh: Event Weekend Dimulai!" class="w-full px-4 py-2.5 rounded-xl border-2 border-paper-dark bg-white text-stone-800 text-sm focus:outline-none focus:border-amber-600 font-medium" />
            </div>

            <div>
              <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Deskripsi *</label>
              <textarea id="news-input-desc" required rows="4" placeholder="Jangan lewatkan event seru minggu ini..." class="w-full px-4 py-2.5 rounded-xl border-2 border-paper-dark bg-white text-stone-800 text-sm focus:outline-none focus:border-amber-600 font-medium"></textarea>
            </div>

            <div>
              <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Gambar (Opsional)</label>
              <input type="file" id="news-input-file" accept="image/*" class="w-full text-xs text-stone-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-2 file:border-paper-dark file:bg-amber-100 file:text-amber-900 file:font-bold hover:file:bg-amber-200 cursor-pointer" />
              <p id="news-file-info" class="text-[11px] text-stone-500 mt-1">Kosongkan jika tidak ingin mengubah gambar.</p>
            </div>

            <button type="submit" id="btn-submit-news" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-extrabold rounded-xl border-2 border-paper-dark shadow-paper-sm active:translate-y-0.5 transition-all text-xs uppercase tracking-wider">
              <i class="fa-solid fa-paper-plane mr-1"></i> TERBITKAN INFORMASI
            </button>
          </form>
        </div>

        <!-- FORM 2: EVENT BARU -->
        <div class="bg-paper-50 p-6 sm:p-8 rounded-3xl border-3 border-paper-dark shadow-paper space-y-6">
          <div class="flex justify-between items-center border-b-2 border-stone-200 pb-4">
            <h2 id="form-event-title" class="font-heading text-2xl font-extrabold text-stone-900">🎉 EVENT BARU</h2>
            <button id="btn-cancel-event" onclick="resetEventForm()" class="hidden px-2.5 py-1 bg-stone-200 hover:bg-stone-300 text-stone-800 text-xs font-bold rounded-lg border border-stone-400">
              Batal Edit
            </button>
          </div>

          <form id="form-event" onsubmit="submitEvent(event)" class="space-y-4">
            <input type="hidden" id="event-id" />

            <div>
              <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Nama Event *</label>
              <input type="text" id="event-input-name" required placeholder="Contoh: Fishing Competition" class="w-full px-4 py-2.5 rounded-xl border-2 border-paper-dark bg-white text-stone-800 text-sm focus:outline-none focus:border-amber-600 font-medium" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Tanggal</label>
                <input type="text" id="event-input-date" placeholder="20 September 2026" class="w-full px-3 py-2 rounded-xl border-2 border-paper-dark bg-white text-stone-800 text-xs focus:outline-none focus:border-amber-600 font-medium" />
              </div>
              <div>
                <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Waktu</label>
                <input type="text" id="event-input-time" placeholder="19:00 WIB" class="w-full px-3 py-2 rounded-xl border-2 border-paper-dark bg-white text-stone-800 text-xs focus:outline-none focus:border-amber-600 font-medium" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Hadiah</label>
              <input type="text" id="event-input-prize" placeholder="Rp 200.000 / Custom Item" class="w-full px-4 py-2.5 rounded-xl border-2 border-paper-dark bg-white text-stone-800 text-sm focus:outline-none focus:border-amber-600 font-medium" />
            </div>

            <div>
              <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Deskripsi Event</label>
              <textarea id="event-input-desc" rows="3" placeholder="Aturan & detail lomba..." class="w-full px-4 py-2.5 rounded-xl border-2 border-paper-dark bg-white text-stone-800 text-sm focus:outline-none focus:border-amber-600 font-medium"></textarea>
            </div>

            <div class="flex items-center gap-3 p-3 bg-amber-50 rounded-xl border border-amber-300">
              <input type="checkbox" id="event-input-active" checked class="w-5 h-5 text-amber-600 rounded border-2 border-paper-dark focus:ring-amber-500 cursor-pointer" />
              <label for="event-input-active" class="text-xs font-bold text-stone-800 cursor-pointer">
                Status: Event Aktif (Ditampilkan di Website)
              </label>
            </div>

            <div>
              <label class="block text-xs font-extrabold uppercase text-stone-700 mb-1">Gambar (Opsional)</label>
              <input type="file" id="event-input-file" accept="image/*" class="w-full text-xs text-stone-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-2 file:border-paper-dark file:bg-rose-100 file:text-rose-900 file:font-bold hover:file:bg-rose-200 cursor-pointer" />
            </div>

            <button type="submit" id="btn-submit-event" class="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-extrabold rounded-xl border-2 border-paper-dark shadow-paper-sm active:translate-y-0.5 transition-all text-xs uppercase tracking-wider">
              <i class="fa-solid fa-trophy mr-1"></i> TERBITKAN EVENT
            </button>
          </form>
        </div>

      </div>

      <!-- KELOLA DAFTAR EVENT & INFORMASI TERDAFTAR -->
      <div class="grid lg:grid-cols-2 gap-8 pt-4">
        
        <!-- MANAGEMENT 1: EVENT TERDAFTAR -->
        <div class="bg-paper-50 p-6 rounded-3xl border-3 border-paper-dark shadow-paper space-y-4">
          <h3 class="font-heading font-extrabold text-xl text-stone-900 border-b-2 border-stone-200 pb-3">
            📋 KELOLA DAFTAR EVENT
          </h3>

          <div id="list-admin-events" class="space-y-3">
            <p class="text-xs text-stone-500 text-center py-4 font-semibold">Memuat daftar event...</p>
          </div>
        </div>

        <!-- MANAGEMENT 2: INFORMASI TERDAFTAR -->
        <div class="bg-paper-50 p-6 rounded-3xl border-3 border-paper-dark shadow-paper space-y-4">
          <h3 class="font-heading font-extrabold text-xl text-stone-900 border-b-2 border-stone-200 pb-3">
            📢 KELOLA DAFTAR INFORMASI
          </h3>

          <div id="list-admin-news" class="space-y-3">
            <p class="text-xs text-stone-500 text-center py-4 font-semibold">Memuat daftar informasi...</p>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- VANILLA JAVASCRIPT LOGIC FOR ADMIN -->
  <script>
    /* ==========================================
       1. SUPABASE CONFIGURATION
       ========================================== */
    const SUPABASE_URL = "";
    const SUPABASE_ANON_KEY = "";

    let _supabase = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL !== "MASUKKAN_SUPABASE_URL") {
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    /* Cache Data Local */
    let cachedEvents = [];
    let cachedNews = [];

    /* ==========================================
       2. AUTHENTICATION (SUPABASE AUTH)
       ========================================== */
    async function checkAuthSession() {
      if (!_supabase) {
        showToast("Konfigurasi Supabase URL/Key belum dimasukkan!", true);
        return;
      }

      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        document.getElementById('section-login').classList.add('hidden');
        document.getElementById('section-dashboard').classList.remove('hidden');
        document.getElementById('user-email-badge').innerText = session.user.email;
        loadAdminEvents();
        loadAdminNews();
      } else {
        document.getElementById('section-login').classList.remove('hidden');
        document.getElementById('section-dashboard').classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      if (!_supabase) {
        showToast("Konfigurasi Supabase URL/Key belum diisi!", true);
        return;
      }

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerText = "MEMPROSES LOGIN...";

      try {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        showToast("Login Berhasil! Selamat datang.");
        checkAuthSession();
      } catch (err) {
        showToast(`Login Gagal: ${err.message}`, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket mr-1.5"></i> LOGIN DASHBOARD`;
      }
    }

    async function handleLogout() {
      if (!_supabase) return;
      await _supabase.auth.signOut();
      showToast("Berhasil Logout.");
      checkAuthSession();
    }

    /* ==========================================
       3. HELPER: UPLOAD FILE TO STORAGE
       ========================================== */
    async function uploadImageFile(file, folder) {
      if (!file) return null;

      const fileExt = file.name.split('.').pop();
      const fileName = `${folder}/${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

      const { data, error } = await _supabase.storage
        .from('website-images')
        .upload(fileName, file, { cacheControl: '3600', upsert: false });

      if (error) {
        throw new Error(`Gagal upload gambar: ${error.message}`);
      }

      const { data: publicUrlData } = _supabase.storage
        .from('website-images')
        .getPublicUrl(fileName);

      return publicUrlData.publicUrl;
    }

    /* ==========================================
       4. CRUD EVENT SYSTEM
       ========================================== */
    async function loadAdminEvents() {
      const container = document.getElementById('list-admin-events');
      try {
        const { data, error } = await _supabase
          .from('events')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        cachedEvents = data || [];

        if (cachedEvents.length === 0) {
          container.innerHTML = `<p class="text-xs text-stone-500 text-center py-4 font-semibold">Belum ada event terdaftar.</p>`;
          return;
        }

        container.innerHTML = cachedEvents.map(ev => `
          <div class="p-4 bg-white rounded-2xl border-2 border-paper-dark shadow-paper-sm space-y-3">
            <div class="flex justify-between items-start gap-2">
              <div>
                <h4 class="font-heading font-extrabold text-base text-stone-900">${ev.name}</h4>
                <p class="text-xs text-stone-500 font-mono">${ev.date || '-'} • ${ev.time || '-'}</p>
              </div>
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold border ${
                ev.is_active ? 'bg-emerald-100 text-emerald-800 border-emerald-400' : 'bg-stone-200 text-stone-600 border-stone-400'
              }">
                ${ev.is_active ? '🟢 Aktif' : '⚪ Nonaktif'}
              </span>
            </div>

            <div class="flex flex-wrap gap-2 pt-1 border-t border-stone-200">
              <button onclick="editEvent('${ev.id}')" class="px-3 py-1 bg-amber-400 hover:bg-amber-500 text-stone-900 text-xs font-bold rounded-lg border border-paper-dark">
                <i class="fa-solid fa-pen-to-square"></i> Edit
              </button>
              <button onclick="toggleEventStatus('${ev.id}', ${!ev.is_active})" class="px-3 py-1 ${ev.is_active ? 'bg-stone-200 text-stone-800' : 'bg-emerald-500 text-white'} text-xs font-bold rounded-lg border border-paper-dark">
                ${ev.is_active ? 'Nonaktifkan' : 'Aktifkan'}
              </button>
              <button onclick="deleteEvent('${ev.id}')" class="px-3 py-1 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-lg border border-paper-dark">
                <i class="fa-solid fa-trash"></i> Hapus
              </button>
            </div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<p class="text-xs text-rose-600 text-center py-2 font-bold">Gagal memuat event: ${err.message}</p>`;
      }
    }

    async function submitEvent(e) {
      e.preventDefault();
      const id = document.getElementById('event-id').value;
      const name = document.getElementById('event-input-name').value;
      const date = document.getElementById('event-input-date').value;
      const time = document.getElementById('event-input-time').value;
      const prize = document.getElementById('event-input-prize').value;
      const description = document.getElementById('event-input-desc').value;
      const is_active = document.getElementById('event-input-active').checked;
      const fileInput = document.getElementById('event-input-file');
      const btn = document.getElementById('btn-submit-event');

      btn.disabled = true;
      btn.innerText = "MENYIMPAN EVENT...";

      try {
        let image_url = null;
        if (id) {
          const existing = cachedEvents.find(item => item.id === id);
          if (existing) image_url = existing.image_url;
        }

        if (fileInput.files.length > 0) {
          image_url = await uploadImageFile(fileInput.files[0], 'events');
        }

        const payload = {
          name, date, time, prize, description, is_active, updated_at: new Date().toISOString()
        };
        if (image_url) payload.image_url = image_url;

        if (id) {
          const { error } = await _supabase.from('events').update(payload).eq('id', id);
          if (error) throw error;
          showToast("Event berhasil diperbarui!");
        } else {
          const { error } = await _supabase.from('events').insert([payload]);
          if (error) throw error;
          showToast("Event baru berhasil diterbitkan!");
        }

        resetEventForm();
        loadAdminEvents();

      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-trophy mr-1"></i> TERBITKAN EVENT`;
      }
    }

    function editEvent(id) {
      const ev = cachedEvents.find(item => item.id === id);
      if (!ev) return;

      document.getElementById('event-id').value = ev.id;
      document.getElementById('event-input-name').value = ev.name || '';
      document.getElementById('event-input-date').value = ev.date || '';
      document.getElementById('event-input-time').value = ev.time || '';
      document.getElementById('event-input-prize').value = ev.prize || '';
      document.getElementById('event-input-desc').value = ev.description || '';
      document.getElementById('event-input-active').checked = ev.is_active;

      document.getElementById('form-event-title').innerText = "✏️ EDIT EVENT";
      document.getElementById('btn-submit-event').innerHTML = `<i class="fa-solid fa-floppy-disk mr-1"></i> SIMPAN PERUBAHAN EVENT`;
      document.getElementById('btn-cancel-event').classList.remove('hidden');

      window.scrollTo({ top: document.getElementById('form-event').offsetTop - 100, behavior: 'smooth' });
    }

    function resetEventForm() {
      document.getElementById('form-event').reset();
      document.getElementById('event-id').value = '';
      document.getElementById('event-input-active').checked = true;
      document.getElementById('form-event-title').innerText = "🎉 EVENT BARU";
      document.getElementById('btn-submit-event').innerHTML = `<i class="fa-solid fa-trophy mr-1"></i> TERBITKAN EVENT`;
      document.getElementById('btn-cancel-event').classList.add('hidden');
    }

    async function toggleEventStatus(id, newStatus) {
      try {
        const { error } = await _supabase.from('events').update({ is_active: newStatus }).eq('id', id);
        if (error) throw error;
        showToast("Status event berhasil diubah.");
        loadAdminEvents();
      } catch (err) {
        showToast(`Gagal merubah status: ${err.message}`, true);
      }
    }

    async function deleteEvent(id) {
      if (!confirm("Apakah Anda yakin ingin menghapus event ini?")) return;
      try {
        const { error } = await _supabase.from('events').delete().eq('id', id);
        if (error) throw error;
        showToast("Event berhasil dihapus.");
        loadAdminEvents();
      } catch (err) {
        showToast(`Gagal menghapus: ${err.message}`, true);
      }
    }

    /* ==========================================
       5. CRUD NEWS/INFORMASI SYSTEM
       ========================================== */
    async function loadAdminNews() {
      const container = document.getElementById('list-admin-news');
      try {
        const { data, error } = await _supabase
          .from('news')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        cachedNews = data || [];

        if (cachedNews.length === 0) {
          container.innerHTML = `<p class="text-xs text-stone-500 text-center py-4 font-semibold">Belum ada informasi diterbitkan.</p>`;
          return;
        }

        container.innerHTML = cachedNews.map(item => `
          <div class="p-4 bg-white rounded-2xl border-2 border-paper-dark shadow-paper-sm space-y-3">
            <div>
              <h4 class="font-heading font-extrabold text-base text-stone-900">${item.title}</h4>
              <p class="text-[11px] text-stone-500 font-mono">${new Date(item.created_at).toLocaleDateString('id-ID')}</p>
            </div>

            <p class="text-xs text-stone-600 line-clamp-2">${item.description}</p>

            <div class="flex flex-wrap gap-2 pt-1 border-t border-stone-200">
              <button onclick="editNews('${item.id}')" class="px-3 py-1 bg-amber-400 hover:bg-amber-500 text-stone-900 text-xs font-bold rounded-lg border border-paper-dark">
                <i class="fa-solid fa-pen-to-square"></i> Edit
              </button>
              <button onclick="deleteNews('${item.id}')" class="px-3 py-1 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-lg border border-paper-dark">
                <i class="fa-solid fa-trash"></i> Hapus
              </button>
            </div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<p class="text-xs text-rose-600 text-center py-2 font-bold">Gagal memuat berita: ${err.message}</p>`;
      }
    }

    async function submitNews(e) {
      e.preventDefault();
      const id = document.getElementById('news-id').value;
      const title = document.getElementById('news-input-title').value;
      const description = document.getElementById('news-input-desc').value;
      const fileInput = document.getElementById('news-input-file');
      const btn = document.getElementById('btn-submit-news');

      btn.disabled = true;
      btn.innerText = "MENERBITKAN INFORMASI...";

      try {
        let image_url = null;
        if (id) {
          const existing = cachedNews.find(item => item.id === id);
          if (existing) image_url = existing.image_url;
        }

        if (fileInput.files.length > 0) {
          image_url = await uploadImageFile(fileInput.files[0], 'news');
        }

        const payload = { title, description, updated_at: new Date().toISOString() };
        if (image_url) payload.image_url = image_url;

        if (id) {
          const { error } = await _supabase.from('news').update(payload).eq('id', id);
          if (error) throw error;
          showToast("Informasi berhasil diperbarui!");
        } else {
          const { error } = await _supabase.from('news').insert([payload]);
          if (error) throw error;
          showToast("Informasi baru berhasil diterbitkan!");
        }

        resetNewsForm();
        loadAdminNews();

      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane mr-1"></i> TERBITKAN INFORMASI`;
      }
    }

    function editNews(id) {
      const item = cachedNews.find(n => n.id === id);
      if (!item) return;

      document.getElementById('news-id').value = item.id;
      document.getElementById('news-input-title').value = item.title || '';
      document.getElementById('news-input-desc').value = item.description || '';

      document.getElementById('form-news-title').innerText = "✏️ EDIT INFORMASI";
      document.getElementById('btn-submit-news').innerHTML = `<i class="fa-solid fa-floppy-disk mr-1"></i> SIMPAN INFORMASI`;
      document.getElementById('btn-cancel-news').classList.remove('hidden');

      window.scrollTo({ top: document.getElementById('form-news').offsetTop - 100, behavior: 'smooth' });
    }

    function resetNewsForm() {
      document.getElementById('form-news').reset();
      document.getElementById('news-id').value = '';
      document.getElementById('form-news-title').innerText = "📰 INFORMASI TERBARU";
      document.getElementById('btn-submit-news').innerHTML = `<i class="fa-solid fa-paper-plane mr-1"></i> TERBITKAN INFORMASI`;
      document.getElementById('btn-cancel-news').classList.add('hidden');
    }

    async function deleteNews(id) {
      if (!confirm("Apakah Anda yakin ingin menghapus informasi ini?")) return;
      try {
        const { error } = await _supabase.from('news').delete().eq('id', id);
        if (error) throw error;
        showToast("Informasi berhasil dihapus.");
        loadAdminNews();
      } catch (err) {
        showToast(`Gagal menghapus: ${err.message}`, true);
      }
    }

    /* ==========================================
       6. UTILITIES
       ========================================== */
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      toastMessage.innerText = message;
      if (isError) {
        toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-xl";
      } else {
        toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-xl";
      }
      
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      
      setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 3500);
    }

    document.addEventListener('DOMContentLoaded', checkAuthSession);
  </script>
</body>
</html>
